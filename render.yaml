# Render Blueprint: a free PostgreSQL database + one free web service built from the Dockerfile.
# In Render: New > Blueprint > pick this repo > Apply. Nothing needs to be typed in.
#
# Note: Render deletes free databases 30 days after creation (with email warnings first).
# To keep data longer, either upgrade the database plan, or point DATABASE_URL at another free
# Postgres such as Neon (neon.tech) and remove the `databases` section below.

databases:
  - name: resumelens-db
    plan: free
    databaseName: resumelens
    user: resumelens
    ipAllowList: []  # only reachable from Render services, not the public internet

services:
  - type: web
    name: resumelens-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Filled in by Render from the database above (private network address).
      - key: DATABASE_URL
        fromDatabase:
          name: resumelens-db
          property: connectionString
      # Signs login tokens. Render generates a random value once.
      - key: JWT_SECRET
        generateValue: true
      # The site is served over HTTPS, so auth cookies are HTTPS-only.
      - key: COOKIE_SECURE
        value: "true"
      # mock = built-in matcher (no key). To use an AI model later, set this to groq (or gemini)
      # and add GROQ_API_KEY (or GOOGLE_API_KEY) under the service's Environment settings.
      - key: LLM_PROVIDER
        value: mock
